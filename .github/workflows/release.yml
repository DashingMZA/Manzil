name: Release

# Ek git tag jo "v" se shuru ho (jaise v1.0.1) push karne pe ye workflow
# chalta hai — Windows/macOS (Intel + Apple Silicon)/Linux par app build
# karta hai, bundled Node sidecar khud fetch karta hai (`pnpm fetch:node`
# — dekhein `scripts/fetch-node.mjs`), aur ek GitHub Release (draft) bana
# kar sab installers + updater artifact (`latest.json`) attach kar deta hai.
#
# Trigger karne ka tareeqa:
#   git tag v1.0.1
#   git push origin v1.0.1
#
# Zaroori GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           updater signing private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  usi key ka password
#
# Ye keys khud generate karne ka tareeqa RELEASES.md mein hai. `GITHUB_TOKEN`
# khud GitHub deta hai, alag se set karne ki zaroorat nahi.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Release create/upload karne ke liye zaroori hai, warna tauri-action
# "Resource not accessible by integration" jaisi permission error de sakta hai.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install

      # Icons har platform ke liye pehle se repo mein committed hain
      # (`src-tauri/icons/`), is liye `pnpm app:icon` yahan chalane ki
      # zaroorat nahi.

      # Node sidecar GitHub runner se download hota hai — GitHub ka
      # network nodejs.org se seedha bhi tez hota hai, aur har platform
      # apna hi target fetch karta hai (`fetch-node.mjs` `TARGET_TRIPLE` env
      # se decide karta hai, neeche dekhein).
      # `tauri.conf.json` ka `beforeBundleCommand` bhi isay khud chala
      # leta hai, lekin yahan explicit rakha hai taake agar fail ho to
      # saaf alag step mein dikhe, build step ke andar dabi hui na rahe.
      #
      # TARGET_TRIPLE zaroori hai: `macos-latest` runner Apple Silicon hai, to
      # `x86_64-apple-darwin` wali leg ko bina isay arm64 ka Node mil jata
      # tha aur build.rs `binaries/node-x86_64-apple-darwin` na milne par
      # ruk jata tha. Ab script host se nahi, is matrix target se chunti hai.
      - name: Fetch bundled Node sidecar for this target
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: pnpm fetch:node

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Manzil ${{ github.ref_name }}"
          releaseBody: "Downloads neeche hain — apne OS ke hisaab se sahi file le lo."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
