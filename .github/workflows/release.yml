name: Release

# Pushing a git tag that starts with "v" (for example v1.1.11) runs this
# workflow — it builds the Windows app and creates a GitHub Release
# (draft) with the installer, the updater artifacts (latest.json) and
# the portable ZIP attached.
#
# How to trigger it:
#   git tag v1.1.11
#   git push origin v1.1.11
#
# Windows only: this app targets Windows (bundle targets: ["nsis"] in
# src-tauri/tauri.conf.json), matching the upstream releases, which ship
# a Windows installer and a portable ZIP only.
#
# Important GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY=(your private key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD=(your password)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Required to create the release and upload assets, otherwise
# tauri-action fails with a permission error such as
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Install pnpm BEFORE setup-node — setup-node's pnpm cache option
      # (below) looks for an already-available pnpm executable.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # No `version:` input here: package.json already pins the pnpm
        # version via `packageManager`, and pnpm/action-setup v6 errors
        # out when both are set ("Multiple versions of pnpm specified").
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install

      # Icons har platform ke liye pehle se repo mein committed hain
      # (`src-tauri/icons/`), is liye `pnpm app:icon` yahan chalane ki
      # zaroorat nahi.

      # Node sidecar GitHub runner se download hota hai — GitHub ka
      # network nodejs.org se seedha bhi tez hota hai, aur har platform
      # apna hi target fetch karta hai (`fetch-node.mjs` `TARGET_TRIPLE` env
      # se decide karta hai, neeche dekhein).
      # `tauri.conf.json` ka `beforeBundleCommand` bhi isay khud chala
      # leta hai, lekin yahan explicit rakha hai taake agar fail ho to
      # saaf alag step mein dikhe, build step ke andar dabi hui na rahe.
      #
      # TARGET_TRIPLE zaroori hai: `macos-latest` runner Apple Silicon hai, to
      # `x86_64-apple-darwin` wali leg ko bina isay arm64 ka Node mil jata
      # tha aur build.rs `binaries/node-x86_64-apple-darwin` na milne par
      # ruk jata tha. Ab script host se nahi, is matrix target se chunti hai.
      - name: Fetch bundled Node sidecar for this target
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: pnpm fetch:node

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Manzil ${{ github.ref_name }}"
          releaseBody: "Downloads neeche hain — apne OS ke hisaab se sahi file le lo."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
