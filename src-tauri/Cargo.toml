[package]
name = "Manzil"
version = "1.0.5"
description = "NVIDIA NIM -> Claude Code proxy control panel"
authors = ["Zaheer Ahmad"]
homepage = "https://manzil.bond"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: Tauri crates ke versions yahan haath se pin NAHI karne — `pnpm app:build`
# / `app:dev` aur CI `scripts/sync-tauri-versions.mjs` chala kar inhein NPM ke
# asal install hue versions (`~MAJOR.MINOR`) par khud set kar dete hain. Wajah
# us script ke upar likhi hai (crate/npm mismatch par `tauri build` rukti hai).
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "~2.5", features = ["sqlite"] }
tauri-plugin-shell = "~2.5"
tauri-plugin-opener = "~2.7"
tauri-plugin-dialog = "~2.8"
tauri-plugin-fs = "~2.7"
tauri-plugin-clipboard-manager = "~2.4"
tauri-plugin-updater = "~2.13"
tauri-plugin-process = "~2.4"
tauri-plugin-autostart = "~2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
